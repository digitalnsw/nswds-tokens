name: CI

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  validate-tokens:
    name: Validate tokens
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Validate token references, duplicates, and shape
        run: npm run validate:tokens

  release-rules:
    name: Release rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm clean-install

      - name: Assert breaking commits map to a major bump
        run: npm run check:release-rules

  release-plugins:
    name: Release plugins
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm clean-install

      # Exercises the changelog + git plugin hooks in a throwaway repo whose
      # remote is a local bare repo: the guard makes no network calls and needs
      # no registry auth or publish token. The install step above is this job's
      # only registry access.
      - name: Assert the release plugins write and push the release commit
        run: npm run check:release-plugins

      # Complements the above by resolving EVERY configured plugin, including
      # @semantic-release/npm and @semantic-release/github, which the hermetic
      # guard cannot exercise without a registry. All 15 plugin hooks load, then
      # semantic-release stops before verifyConditions — on `pull_request`
      # because it is a PR, on `merge_group` because the queue branch is not
      # `main` — and exits 0. That is the point: no npm publish token is needed
      # in PR CI, and a plugin that fails to resolve (a bad ESM major, a missing
      # dependency) still fails here.
      #
      # Do NOT add --no-ci. It makes semantic-release resolve the detached PR
      # HEAD as `main`, run verifyConditions, and fail on @semantic-release/npm's
      # registry auth check (E401) — a permanently red job.
      - name: Resolve every configured release plugin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release --dry-run

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm clean-install

      - name: Lint
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm clean-install

      - name: Typecheck scripts and tests
        run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm clean-install

      - name: Run tests
        run: npm run test:tokens

  check-staging:
    name: Check Figma staging
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm clean-install

      - name: Verify Figma staging files match their canonical sources
        run: npm run check:staging

  package-surface:
    name: Package surface
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm clean-install

      - name: Build outputs
        run: npm run build

      - name: Smoke-test the published package surface
        run: npm run smoke:package-surface
